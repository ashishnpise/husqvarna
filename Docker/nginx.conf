# ==============================================================================
# Husqvarna AI Query Assistant - Frontend Nginx Production Configuration
# Reverse proxy, SPA fallback, security headers, and asset caching
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Gzip Compression for optimal network delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Enterprise HTTP Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http://localhost:5001 http://*:5001 https:;" always;

    root /usr/share/nginx/html;
    index index.html;

    # API Reverse Proxy Routing (Deferred DNS resolution via variable prevents Nginx startup failure)
    location /api/ {
        resolver 169.254.169.253 8.8.8.8 valid=30s ipv6=off;
        set $backend_upstream "http://15.207.101.20:5001";
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Static Assets Caching (1 Year Immutable)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Single Page Application (SPA) Client Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Standard Error Fallback
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
