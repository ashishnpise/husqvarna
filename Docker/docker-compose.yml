# ==============================================================================
# Husqvarna AI Query Assistant - Multi-Container Docker Compose Stack
# ==============================================================================
# Usage from Docker directory:
#   docker compose up --build
#   docker compose down
# ==============================================================================

name: husqvarna

services:
  # ----------------------------------------------------------------------------
  # Backend API Service (Node.js 22 / Express / TypeScript / Gemini)
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.server
    container_name: husqvarna-backend
    restart: unless-stopped
    env_file:
      - ../config/.env.app
    environment:
      - PORT=5001
      - NODE_ENV=production
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - husqvarna-network

  # ----------------------------------------------------------------------------
  # Frontend Web Client (React 18 / Vite / Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  client:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.client
    container_name: husqvarna-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - husqvarna-network

# ------------------------------------------------------------------------------
# Isolated Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  husqvarna-network:
    driver: bridge
    name: husqvarna-network
